name: Roleta regression guardrails
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'test/regression-guardrails-20261009'
jobs:
  regression:
    name: canonical ledger and simulation invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/regression/*.test.cjs
