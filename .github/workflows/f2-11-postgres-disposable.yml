name: F2-11 disposable PostgreSQL security
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: roleta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roleta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Verify disposable target and run negative privilege tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: roleta_ci
          PGUSER: postgres
          PGPASSWORD: ci-disposable-only
        run: |
          test "$PGDATABASE" = roleta_ci
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/disposable-security.sql
