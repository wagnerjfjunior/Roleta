name: Gemini intake safety
on:
  pull_request:
    paths:
      - 'api/roleta-ocr.js'
      - 'gemini-intake-converter.js'
      - 'gemini-draft-ui.js'
      - 'styles.css'
      - 'roulette-intake.js'
      - 'lib/roleta-pdf.js'
      - 'api/roleta-pdf.js'
      - 'scripts/local-pdf-server.cjs'
      - 'tests/local-pdf-server.test.cjs'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/gemini-intake.yml'
  push:
    branches:
      - 'feat/gemini-draft-rlt-v2-20261008'
jobs:
  node-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api/roleta-ocr.js
      - run: node --check gemini-draft-ui.js
      - run: node --check roulette-intake.js
      - run: node --check lib/roleta-pdf.js
      - run: node --check api/roleta-pdf.js
      - run: node --check scripts/local-pdf-server.cjs
      - run: npm install --no-package-lock --ignore-scripts
      - run: node --check gemini-intake-converter.js
      - run: node tests/gemini-intake-converter.test.cjs
      - run: node tests/roleta-ocr-relay.test.cjs
      - run: node tests/ios-print-gesture.test.cjs
      - run: node tests/backfill-mobile-review-ui.test.cjs
      - run: node tests/roleta-pdf-share.test.cjs
      - run: node tests/local-pdf-server.test.cjs
