name: Gemini intake safety
on:
  pull_request:
    paths:
      - 'api/roleta-ocr.js'
      - 'api/ocr-shadow-submit.js'
      - 'server/ocr-shadow-link.cjs'
      - 'server/ocr-shadow-retention.cjs'
      - 'server/ocr-shadow-cleanup.cjs'
      - 'server/ocr-space-draft.cjs'
      - 'gemini-intake-converter.js'
      - 'gemini-draft-ui.js'
      - 'intake-normalization.js'
      - 'ocr-learning.js'
      - 'reconciliation/identity.js'
      - 'photo-prepare.js'
      - 'styles.css'
      - 'roulette-intake.js'
      - 'lib/roleta-pdf.js'
      - 'api/roleta-pdf.js'
      - 'scripts/local-pdf-server.cjs'
      - 'tests/local-pdf-server.test.cjs'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/gemini-intake.yml'
  push:
    branches:
      - 'feat/gemini-draft-rlt-v2-20261008'
jobs:
  node-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api/roleta-ocr.js
      - run: node --check server/ocr-space-draft.cjs
      - run: node --check gemini-draft-ui.js
      - run: node --check photo-prepare.js
      - run: node --check roulette-intake.js
      - run: node --check lib/roleta-pdf.js
      - run: node --check api/roleta-pdf.js
      - run: node --check scripts/local-pdf-server.cjs
      - run: npm install --no-package-lock --ignore-scripts
      - run: node --check gemini-intake-converter.js
      - run: node --check ocr-learning.js
      - run: node --test tests/ocr-learning.test.cjs tests/ocr-learning-ui.test.cjs
      - run: node --check api/ocr-shadow-submit.js
      - run: node --check server/ocr-shadow-link.cjs
      - run: node --check server/ocr-shadow-retention.cjs
      - run: node --check server/ocr-shadow-cleanup.cjs
      - run: node --test tests/ocr-shadow-link.test.cjs tests/ocr-shadow-submit.test.cjs tests/ocr-shadow-retention.test.cjs tests/ocr-shadow-cleanup.test.cjs
      - run: node tests/gemini-intake-converter.test.cjs
      - run: node tests/intake-normalization.test.cjs
      - run: node tests/roleta-ocr-relay.test.cjs
      - run: node --test tests/ocr-space-draft.test.cjs
      - run: node --test tests/ocr-review-render.test.cjs
      - run: node tests/roleta-ocr-timeout.test.cjs
      - run: node tests/photo-prepare.test.cjs
      - run: node tests/ios-print-gesture.test.cjs
      - run: node tests/backfill-mobile-review-ui.test.cjs
      - run: node tests/roleta-pdf-share.test.cjs
      - run: node tests/local-pdf-server.test.cjs
