name: Gate E intake integrity
on:
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  intake-guard:
    name: Gate E intake manifest and proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pull request (branch + exact SHA)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GATE_E_PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          GATE_E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_E_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_E_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GATE_E_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GATE_E_HEAD_REPO" = "$GATE_E_BASE_REPO"
          git fetch --no-tags origin "$GATE_E_BASE_SHA" "$GATE_E_HEAD_SHA"
          git checkout --detach "$GATE_E_HEAD_SHA"
          node scripts/gate-e/ci-policy.cjs
      - name: Validate merge queue candidate
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Merge queue requires a separate full gate against its generated merge-group base."
          echo "Fail closed until the queue-specific validator is implemented."
          exit 1
      - name: Regression suite
        if: ${{ github.event_name == 'pull_request' }}
        run: node --test tests/regression/*.test.cjs
