name: Gate E intake integrity
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions:
  contents: read
jobs:
  intake-guard:
    name: Gate E intake manifest and proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected base only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pull request using protected code
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GATE_E_PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          GATE_E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_E_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_E_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GATE_E_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          GATE_E_TRUSTED_CHECKOUT: base
        shell: bash
        run: |
          set -euo pipefail
          test "$GATE_E_HEAD_REPO" = "$GATE_E_BASE_REPO"
          BASE_SHA="$GATE_E_BASE_SHA"
          HEAD_SHA="$GATE_E_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          # Candidate bytes are read through git show; never checkout or execute HEAD.
          node scripts/gate-e/ci-policy.cjs
      - name: Reject unsupported merge queue
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          echo "Merge queue requires a separate full gate."
          exit 1
